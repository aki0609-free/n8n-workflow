[project]
name = "n8n-data-processing"
version = "0.1.0"
description = "Python data processing / scraping helpers for n8n workflows"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src/python"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/python", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
