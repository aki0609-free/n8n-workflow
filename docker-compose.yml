name: n8n-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${N8N_PORT:-5678}:5678'
    # API キー・設定値（npm run secrets:init で作成）。ワークフローの式から {{ $env.KEY }} で参照できる
    env_file:
      - path: ./secrets/secrets.env
        required: false
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tokyo}
      TZ: ${GENERIC_TIMEZONE:-Asia/Tokyo}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      # 式での $env 参照を許可（secrets/secrets.env の [env] 値を使うため）
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_PUBLIC_API_DISABLED: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
      # import / export 用にリポジトリの workflows/ をコンテナへマウント
      - ./workflows:/home/node/workflows
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5678/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  dashy:
    image: lissy93/dashy:${DASHY_VERSION:-4.9.0}
    restart: unless-stopped
    ports:
      - '${DASHY_PORT:-4000}:8080'
    volumes:
      # conf.yml は npm run dashy:sync で生成。ファイル単体ではなくディレクトリをマウントする
      # （ファイル単体のマウントだと、書き換え後に反映されないことがある）
      - ./dashy/user-data:/app/user-data
    extra_hosts:
      # ステータス確認でホスト上の Workflow Studio（:3100）に到達するため
      - 'host.docker.internal:host-gateway'
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
