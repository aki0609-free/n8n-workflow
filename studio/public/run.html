<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ワークフローを実行</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">▶</span>
        <div>
          <h1 id="wf-name">ワークフローを実行</h1>
          <p id="wf-file" class="sub"></p>
        </div>
      </div>
      <nav class="links">
        <a id="link-editor" href="#" target="_blank" rel="noopener">n8n で編集</a>
        <a id="link-dashy" href="http://localhost:4000">Dashy に戻る</a>
      </nav>
    </header>

    <main class="run-main">
      <section class="run-card">
        <div id="run-body"></div>
      </section>

      <section id="result" class="run-card" hidden>
        <div class="job-head">
          <h2>結果</h2>
          <span id="result-status" class="status"></span>
        </div>
        <p id="result-hint" class="hint warn-text" hidden></p>
        <pre id="result-body" class="result-body"></pre>
      </section>
    </main>

    <script src="/run.js"></script>
  </body>
</html>
