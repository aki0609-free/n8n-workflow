name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow JSON checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: JSON syntax (jq)
        run: |
          status=0
          for f in workflows/*.json; do
            jq empty "$f" || { echo "::error file=$f::Invalid JSON"; status=1; }
          done
          exit $status
      - name: n8n workflow structure
        run: node scripts/validate-workflows.js
      - name: Code nodes are in sync with src/javascript/code-nodes
        run: node scripts/sync-code-nodes.js --check

  javascript:
    name: JavaScript (Prettier + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:coverage

  python:
    name: Python (Ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker-compose:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp env.example .env
      - run: docker compose config --quiet
